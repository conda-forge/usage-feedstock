context:
  version: "6.12.1"

package:
  name: usage
  version: ${{ version }}

source:
  url: https://github.com/jdx/usage/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1666a64f07a7937f62fc47eaf0e06d4e79c24eb2e965843237554fe43b719ca3

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd cli
      - ^cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - ^cargo-bundle-licenses --format=yaml --output=../THIRDPARTY.yml
      # copy manpage
      - mkdir ($prefix)/share/man/man1
      - cp assets/*.1 ($prefix)/share/man/man1/
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - ^usage --completions bash | save --force ($prefix)/share/bash-completion/completions/usage
          - ^usage --completions fish | save --force ($prefix)/share/fish/vendor_completions.d/usage.fish
          - ^usage --completions zsh  | save --force ($prefix)/share/zsh/site-functions/_usage

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - usage --help
      - usage --version
  - package_contents:
      bin:
        - usage
      files:
        - if: unix
          then:
            - share/man/man1/usage.1
            - if: build_platform == host_platform
              then:
                - share/bash-completion/completions/usage
                - share/fish/vendor_completions.d/usage.fish
                - share/zsh/site-functions/_usage
        - if: win
          then:
            - Library/share/man/man1/usage.1
            - if: build_platform == host_platform
              then:
                - Library/share/bash-completion/completions/usage
                - Library/share/fish/vendor_completions.d/usage.fish
                - Library/share/zsh/site-functions/_usage
      strict: true

about:
  summary: Usage Spec processor CLI
  description: |
    Usage is a spec and CLI for defining CLI tools. Arguments, flags, environment
    variables, and config files can all be defined in a Usage spec. It can be
    thought of like OpenAPI (swagger) for CLIs. Use it to generate autocompletion
    scripts, markdown documentation, man pages, and more.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://usage.jdx.dev
  documentation: https://usage.jdx.dev/cli/reference/
  repository: https://github.com/jdx/usage

extra:
  recipe-maintainers:
    - salim-b
